<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f6" />
    <title>安护评估 · 住户综合评估</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="安护评估首页">
          <span class="brand-mark">安</span>
          <span><strong>安护评估</strong><small>综合照护工作台</small></span>
        </a>
        <div class="nav-label">工作空间</div>
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>评估总览</button>
        <button class="nav-item" data-page="residents"><span class="nav-icon">♙</span>住户档案</button>
        <button class="nav-item" data-page="rules"><span class="nav-icon">⊙</span>规则说明</button>
        <div class="sidebar-bottom">
          <div class="local-status"><span class="status-dot"></span><span><strong>本地演示模式</strong><small>数据仅保存在此浏览器</small></span></div>
          <div class="sidebar-version">表单版本 0.1 · 规则版本草案</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="breadcrumb"><span>工作空间</span><span class="crumb-sep">/</span><strong id="breadcrumb-current">评估总览</strong></div>
          <div class="topbar-actions"><span class="privacy-chip">演示数据 · 请勿录入真实健康信息</span><button class="button button-primary" id="new-assessment">＋ 新建评估</button></div>
        </header>
        <div id="view" class="view"></div>
        <footer class="app-footer">安护评估是开源原型，不用于诊断或替代专业判断。<a href="https://github.com/cnspica/comprehensive-assessment-system" target="_blank" rel="noreferrer">项目主页 ↗</a></footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
